# 每天 04:30 UTC（北京 12:30，官方 12~16 时出数之后）跑一次百度指数重采，
# 成功就把 baidu-index.json 提交回 Pages 仓库。
#
# 前置（都在 GitHub 网页上设，一次性）：
#   1. 仓库 Settings → Secrets and variables → Actions → New repository secret
#        名字 BDUSS，值贴你自己的百度 BDUSS
#   2. 仓库 Settings → Actions → General → Workflow permissions → Read and write
#      （本文件里的 permissions 已经声明了，但组织级策略可能覆盖它，去网页确认一次最稳）
#   3. 本文件放在仓库的 .github/workflows/ 下，fetch_baidu_index.mjs 放在仓库根
#
# 注意：YAML 的注释只能是 # 开头，写成 /* */ 会让整个文件解析失败、
# GitHub 直接不认这个 workflow（连 Run workflow 按钮都不出现）。

name: baidu-index

on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: baidu-index
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 装 Playwright + Chromium
        run: npm i -D playwright && npx playwright install --with-deps chromium

      # 第一次跑先别配 secret，把下面 BAIDU_PROBE 前面的 # 删掉做一次"机房 IP 探测"：
      #   日志出 PROBE OK                  = 无头浏览器签名被百度接受、Actions 的 IP 干净，再回来配 BDUSS
      #   日志出 PROBE FAIL · status=10018 = 机房 IP 被风控，这条路死，退回人工快照
      - name: 抓取
        env:
          BDUSS: ${{ secrets.BDUSS }}
          BAIDU_WORD: 伟大的长征
          BAIDU_DAYS: '90'
          BAIDU_PROBE: '1'
        run: node fetch_baidu_index.mjs

      - name: 提交结果
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -f baidu-index.json ] || { echo "::notice::没有产出文件，跳过提交（探测模式或抓取失败）"; exit 0; }
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add baidu-index.json
          git diff --cached --quiet || git commit -m "百度指数 $(date -u +%F)"
          git push
