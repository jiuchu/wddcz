# 百度页面写"每天 12~16 时出昨天的数"，但实测会提前：2026-10-16 北京 11:07 时，
# 10-15 的 44,338 已经在百度自己的图上出来了，而看板还停在 10-14（因为旧排期最早 12:00 才跑）。
# 脚本里有"已是最新就跳过"的判断，所以谁先抓到谁提交、每天只产生 1 次 commit。
#
# ⚠ 2026-10-17：这条 schedule 已经**不干活**了。GitHub 的定时事件从他这个账号整个停了
#   （jjc / wddcz / TieBaSign 三个仓库 event=schedule 合计只剩 10-08 以前的记录，
#   手动 workflow_dispatch 一直是好的）。真正每天敲门的是 Cloudflare Worker
#   shy-salad-5c53 的 Cron Triggers，它 POST dispatches 叫起这条 workflow。
#   ⚠ 一天几次、几点敲，全在 Worker 的 Settings → Triggers 页上，代码里没有这个表达式，
#   改节拍去那里改，别动下面这条 schedule（它现在是死的，只当备份）。
#   下面的 schedule 只留两次当备份（北京 13:40 / 17:40），故意和主闹钟错开分钟：
#   同一分钟撞进同一个 concurrency 组会被 cancel-in-progress 把自己掐掉。
#
# 前置（一次性，都在 GitHub 网页上设）：
#   1. Settings → Secrets and variables → Actions → New repository secret，名字 BDUSS
#   2. Settings → Actions → General → Workflow permissions → Read and write
#   3. 本文件放 .github/workflows/ 下，fetch_baidu_index.mjs 放仓库根
#
# 注意：YAML 的注释只能以 # 开头。写成 /* */ 会让整个文件解析失败、
# GitHub 直接不认这个 workflow（连 Run workflow 按钮都不出现）。

name: baidu-index

on:
  schedule:
    - cron: '40 5,9 * * *'
  workflow_dispatch:

permissions:
  contents: write
  # 护栏要读本工作流的 run 列表。写了 permissions 这一节之后，没列出来的作用域全是 none，
  # 所以 actions 必须显式给 read —— 不给的话护栏永远读到 9999，静默失效。
  actions: read

concurrency:
  group: baidu-index
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 两句话：仓库里这份已经是昨天的数了 → 跳过；或者距上一条 run 不足 GAP 分钟 → 跳过。
      # 第二句是防手点的：手点十次就是十次真抓，账号最快也只挨 GAP 分钟一次。
      # ⚠ GAP 必须**小于** Worker 的节拍（现在北京 11:00~20:30 每半小时一格）。
      #   填 90 的话，20 格里只有约 7 格真跑，其余全成 skip，Actions 列表看着像坏了。
      #   20 这个数是"挡住连点、放过正常排班"：GitHub 排队抖动一般也就十几分钟。
      # ⚠ 时钟只能用 run 历史，不能用 baidu-index.json 里的 fetchedAt —— 百度没出数时
      #   脚本压根不写文件（fetch_baidu_index.mjs 末尾 prev >= asof 那句），fetchedAt 会停在
      #   好几天前。2026-10-18 就是这样：百度还停在 10-16，七个格子全成真抓，一个没跳过。
      # ⚠ 要用 BAIDU_PROBE 探测模式时，把下面三处 if 临时删掉 —— 探测模式本来就该每轮真跑。
      - name: 要不要跑
        id: need
        env:
          WF: baidu-index.yml     # API 认的是工作流文件名，不是 name 字段
          GAP: '20'               # 两次真抓之间最少隔这么多分钟
        run: |
          want=$(TZ=Asia/Shanghai date -d "yesterday" +%F)
          have=$(node -p "try{JSON.parse(require('fs').readFileSync('baidu-index.json','utf8')).asof}catch(e){''}")
          curl -sS -m 20 -H "Authorization: Bearer $GITHUB_TOKEN" \
               -H "Accept: application/vnd.github+json" \
               -o _runs.json \
               "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/$WF/runs?per_page=10" || :
          since=$(node -p "try{const j=JSON.parse(require('fs').readFileSync('_runs.json','utf8'));const m=(j.workflow_runs||[]).filter(r=>r.id!==+process.env.GITHUB_RUN_ID).map(r=>(Date.now()-Date.parse(r.created_at))/6e4);m.length?Math.floor(Math.min(...m)):9999}catch(e){9999}")
          # API 没答话（权限没给、网络抖）就当没有上一条：护栏失效但抓取照跑。
          # 反过来 fail-closed 的话，一个 curl 抖动就能让百度指数连着几天不出数。
          case "$since" in ''|*[!0-9]*) since=9999 ;; esac
          echo "仓库里 asof=$have（期望 $want）· 距上一条 run $since 分钟（下限 $GAP）"
          if [ -n "$have" ] && [ "$have" = "$want" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "已经是昨天的数，收工"
          elif [ "$since" -lt "$GAP" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "距上次不足 $GAP 分钟，这发不去敲百度"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 装 Playwright + Chromium
        if: steps.need.outputs.skip != 'true'
        run: npm i -D playwright && npx playwright install --with-deps chromium

      # 第一次跑先别配 secret，把下面 BAIDU_PROBE 前面的 # 删掉做一次"机房 IP 探测"：
      #   日志出 PROBE OK                  = 无头浏览器签名被百度接受、Actions 的 IP 干净，再回来配 BDUSS
      #   日志出 PROBE FAIL · status=10018 = 机房 IP 被风控，这条路死，退回人工快照
      - name: 抓取
        if: steps.need.outputs.skip != 'true'
        env:
          BDUSS: ${{ secrets.BDUSS }}
          BAIDU_WORD: 伟大的长征
          BAIDU_DAYS: '90'
          # BAIDU_PROBE: '1'
        run: node fetch_baidu_index.mjs

      - name: 提交结果
        if: steps.need.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -f baidu-index.json ] || { echo "::notice::没有产出文件，跳过提交（探测模式或抓取失败）"; exit 0; }
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add baidu-index.json
          git diff --cached --quiet || git commit -m "百度指数 $(date -u +%F)"
          git push
